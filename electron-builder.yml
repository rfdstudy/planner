appId: com.planner.app
productName: Planner
copyright: Copyright © 2026 Planner
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!electron/**/*'
  - '!src/**/*'
  - '!tests/**/*'
  - '!docs/**/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs,mts,cts}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
win:
  target:
    - nsis
  executableName: planner
  icon: build/icon.ico
nsis:
  artifactName: Planner-Setup.${ext}
  # Pas de mise à jour différentielle ni de fichier .blockmap : l'installateur
  # est toujours remplacé en entier par la nouvelle version.
  differentialPackage: false
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  # Les données restent dans %APPDATA%\Planner : une désinstallation,
  # une réinstallation ou une mise à jour ne les efface jamais.
  deleteAppDataOnUninstall: false
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: Planner
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false

name: Déployer Planner téléphone

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci
        env:
          # Le build téléphone n’a pas besoin du binaire Electron Windows.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Construire l’application téléphone
        run: npm run build:phone
        env:
          PHONE_BASE: /${{ github.event.repository.name }}/

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publier les fichiers statiques
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-phone

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
